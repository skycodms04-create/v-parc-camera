<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>주차 사진 · V-PARC</title>
<meta name="description" content="V-PARC 반납 촬영 화면 시험. 사진과 영상은 이 폰 밖으로 전송되지 않습니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    letter-spacing: -0.01em; -webkit-tap-highlight-color: transparent; }
  .app { position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .top { height: 56px; display: flex; align-items: center; padding: 0 12px; position: relative; flex-shrink: 0; }
  .top a { width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.16); color: #fff;
    display: flex; align-items: center; justify-content: center; text-decoration: none; position: relative; z-index: 1; }
  .top h1 { position: absolute; inset: 0; margin: 0; display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 600; pointer-events: none; }
  .stage { position: relative; flex: 1; min-height: 0; background: #1a1a1a; border-radius: 16px; overflow: hidden; }
  video, #shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #shot { display: none; }
  .frame { position: absolute; left: 24px; right: 24px; top: 24px; bottom: 84px; border: 2px solid rgba(255,255,255,.85);
    border-radius: 18px; pointer-events: none; transition: border-color .2s; }
  .frame.ok { border-color: #05A357; }
  .pill { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: calc(100% - 32px);
    display: flex; gap: 8px; align-items: center; font-size: 15px; font-weight: 600; color: #000; background: #fff;
    padding: 11px 16px; border-radius: 999px; box-shadow: 0 2px 10px rgba(0,0,0,.25); white-space: nowrap; }
  .pill .dot { width: 8px; height: 8px; border-radius: 4px; background: #FFC043; flex-shrink: 0; }
  .pill.ok .dot { background: #05A357; }
  .pill span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center; color: #cfcfcf; font-size: 15px; line-height: 1.5; }
  .start button, .bottom button.text { appearance: none; border: 0; font: inherit; font-weight: 600; border-radius: 10px; }
  .start button { background: #fff; color: #000; height: 50px; padding: 0 22px; font-size: 16px; }
  .bottom { height: 132px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 16px; flex-shrink: 0; }
  .shutter { appearance: none; width: 76px; height: 76px; border-radius: 38px; border: 4px solid #fff; background: transparent;
    padding: 0; display: flex; align-items: center; justify-content: center; }
  .shutter span { width: 60px; height: 60px; border-radius: 30px; background: #fff; transition: transform .1s; }
  .shutter:active span { transform: scale(.9); }
  .shutter:disabled { opacity: .35; }
  .bottom button.text { flex: 1; height: 54px; font-size: 16px; }
  .bottom .gray { background: #2b2b2b; color: #fff; }
  .bottom .white { background: #fff; color: #000; flex: 1.4; }
  .foot { text-align: center; font-size: 12px; color: #8a8a8a; padding: 0 16px 8px; flex-shrink: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a href="./" aria-label="닫기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 id="title">주차 사진</h1>
  </div>

  <div class="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="shot"></canvas>
    <div class="frame" id="frame" hidden></div>
    <div class="pill" id="pill" hidden><span class="dot"></span><span id="hintText"></span></div>
    <div class="start" id="start">
      <div>킥보드 바퀴 두 개와 바닥이<br>다 보이게 찍어 주세요.</div>
      <button id="btnStart">카메라 켜기</button>
      <div style="font-size:13px;color:#8a8a8a">원본 사진과 위치는 휴대폰 밖으로 나가지 않아요</div>
    </div>
  </div>

  <div class="bottom" id="barShoot">
    <button class="shutter" id="btnShutter" aria-label="촬영" disabled><span></span></button>
  </div>
  <div class="bottom" id="barReview" hidden>
    <button class="text gray" id="btnRetake">다시 찍기</button>
    <button class="text white" id="btnUse">이 사진으로 반납</button>
  </div>
  <div class="foot" id="foot">시험용 화면 · 계획서 A2 규칙(우선순위·5프레임 평균·1.5초 유지)으로 문구를 골라요</div>
</div>

<script type="module">
// ---- 안내 문구: 계획서 A2 ----
// 초당 3번 분석, 최근 5번 중 3번 이상(0.6) 걸린 사유 중 우선순위가 가장 높은 것 하나만 띄움.
// 문구가 바뀐 지 1.5초가 지나지 않았으면 바꾸지 않음. 3번 연속 통과하면 준비 완료(보조선 초록).
const HINTS = {
  none:    { text: "킥보드가 화면에 들어오게 찍어주세요" },
  cut:     { text: "킥보드 전체가 들어오게 해 주세요" },
  floor:   { text: "바닥이 더 보이게 한 걸음 물러나 주세요" },
  blur:    { text: "흔들렸어요. 잠깐 멈춰주세요" },
  light:   { text: "빛을 등지고 밝은 쪽에서 찍어주세요" },
  ready:   { text: "좋아요. 이대로 찍어주세요", ok: true },
  wait:    { text: "지금 찍어도 돼요. 나중에 다시 확인할 수 있어요" },
  loading: { text: "준비 중이에요" },
};
const ORDER = ["none", "cut", "floor", "blur", "light"];      // A2 우선순위
const T = { dark: 45, backlight: 70, blur: 150, edge: 0.02, floor: 0.97, everyMs: 333, win: 5, need: 0.6, holdMs: 1500, readyN: 3, giveUpMs: 15000 };
const TARGET = new Set(["bicycle", "motorcycle", "skateboard"]); // 킥보드는 COCO에 없어서 비슷한 클래스로 대신 잡음

const MP_VER = "0.10.14";
const MP_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/vision_bundle.mjs`;
const MP_WASM = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/wasm`;
const MP_MODEL = "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite";

const $ = (id) => document.getElementById(id);
const video = $("video");
const state = { detector: null, live: false, lastTs: 0, lastCheck: 0, hist: [], okRun: 0, shown: null, shownAt: -1e9, startedAt: 0, current: "loading" };

// 작은 회색조 이미지로 밝기·흔들림·역광을 잼 (160x120)
const small = document.createElement("canvas"); small.width = 160; small.height = 120;
const sctx = small.getContext("2d", { willReadFrequently: true });
function measure() {
  sctx.drawImage(video, 0, 0, 160, 120);
  const d = sctx.getImageData(0, 0, 160, 120).data, g = new Float32Array(160 * 120);
  let sum = 0, top = 0, mid = 0;
  for (let i = 0; i < g.length; i++) {
    g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]; sum += g[i];
    const y = Math.floor(i / 160); if (y < 40) top += g[i]; else if (y < 80) mid += g[i];
  }
  let m = 0, m2 = 0, n = 0;                       // 라플라시안 분산: 낮을수록 흐림
  for (let y = 1; y < 119; y++) for (let x = 1; x < 159; x++) {
    const i = y * 160 + x, v = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - 160] - g[i + 160];
    m += v; m2 += v * v; n++;
  }
  m /= n;
  return { bright: sum / g.length, back: (top - mid) / (160 * 40), sharp: m2 / n - m * m };
}

// 이번 프레임에서 걸린 사유들 (없으면 빈 집합 = 통과)
function reasons(dets) {
  const out = new Set();
  const { bright, back, sharp } = measure();
  window.__last = { bright: Math.round(bright), back: Math.round(back), sharp: Math.round(sharp) };
  if (sharp < T.blur) out.add("blur");
  if (bright < T.dark || back > T.backlight) out.add("light");
  if (!state.detector && !window.__mockDets) return out;   // 검출 모델을 못 불러오면 화면 상태만 봄
  const vw = video.videoWidth, vh = video.videoHeight;
  const boxes = dets.filter((d) => TARGET.has(d.categories[0]?.categoryName)).map((d) => d.boundingBox);
  if (!boxes.length) { out.add("none"); return out; }
  const b = boxes.sort((a, c) => c.width * c.height - a.width * a.height)[0];
  const l = b.originX / vw, r = (b.originX + b.width) / vw, t = b.originY / vh, bt = (b.originY + b.height) / vh;
  if (l < T.edge || r > 1 - T.edge || t < T.edge) out.add("cut");
  if (bt > T.floor) out.add("floor");
  return out;
}

function setHint(key, now) {
  if (key === state.shown) return;
  if (state.shown !== null && state.shown !== "loading" && now - state.shownAt < T.holdMs) return;  // 1.5초 유지
  state.shown = key; state.shownAt = now;
  const h = HINTS[key];
  $("hintText").textContent = h.text;
  $("pill").classList.toggle("ok", !!h.ok);
  $("frame").classList.toggle("ok", !!h.ok);
}

function step(dets, now) {
  const r = reasons(dets);
  state.hist.push(r); if (state.hist.length > T.win) state.hist.shift();
  state.okRun = r.size === 0 ? state.okRun + 1 : 0;
  const ready = state.okRun >= T.readyN;
  // 최근 5번 중 60% 이상 걸린 사유 가운데 우선순위가 가장 높은 것
  const top = ORDER.find((k) => state.hist.filter((h) => h.has(k)).length / state.hist.length >= T.need);
  let key = ready ? "ready" : (top || (state.shown === "ready" ? "ready" : state.shown || "loading"));
  if (!ready && now - state.startedAt > T.giveUpMs && top) key = "wait";   // S2: 15초가 지나도 미달이면 셔터는 열어 둔 채 안내만
  state.current = ready ? "ready" : (top || "pending");
  setHint(key, now);
}

function nextTs() { const t = performance.now(); state.lastTs = Math.max(t, state.lastTs + 1); return state.lastTs; }
function loop(now) {
  if (!state.live) return;
  if (video.readyState >= 2 && now - state.lastCheck > T.everyMs) {
    state.lastCheck = now;
    let dets = [];
    if (window.__mockDets) dets = window.__mockDets(video);              // 시험용
    else if (state.detector) dets = state.detector.detectForVideo(video, nextTs()).detections;
    step(dets, now);
  }
  requestAnimationFrame(loop);
}

async function loadDetector() {
  try {
    const { FilesetResolver, ObjectDetector } = await import(MP_URL);
    const fs = await FilesetResolver.forVisionTasks(MP_WASM);
    const make = (delegate) => ObjectDetector.createFromOptions(fs, {
      baseOptions: { modelAssetPath: MP_MODEL, delegate }, runningMode: "VIDEO", scoreThreshold: 0.3, maxResults: 5 });
    try { state.detector = await make("GPU"); } catch (e) { state.detector = await make("CPU"); }
  } catch (e) {
    console.warn("검출 모델 실패, 밝기·흔들림만 봅니다", e);
    $("foot").textContent = "검출 모델을 못 불러와서 밝기·흔들림만 보고 있어요";
  }
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: false,
    video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 960 } } });
  video.srcObject = stream;
  await video.play();
  await new Promise((r) => video.readyState >= 2 ? r() : video.addEventListener("loadeddata", r, { once: true }));
}

$("btnStart").addEventListener("click", async () => {
  $("btnStart").disabled = true;
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error("이 브라우저는 카메라를 쓸 수 없어요");
    await startCamera();
  } catch (e) {
    $("btnStart").disabled = false;
    $("start").firstElementChild.innerHTML = "카메라를 켜지 못했어요.<br>설정에서 카메라 권한을 허용해 주세요.";
    return;
  }
  $("start").hidden = true; $("frame").hidden = false; $("pill").hidden = false;
  setHint("loading", performance.now());
  state.startedAt = performance.now();
  state.live = true; requestAnimationFrame(loop);
  if (!window.__mockDets) await loadDetector();
  $("btnShutter").disabled = false;
});

// 셔터: 잠그지 않음. 지금 화면을 멈춰서 보여줌. 원본은 휴대폰 밖으로 보내지 않음(가린 사진만 서버로).
$("btnShutter").addEventListener("click", () => {
  const c = $("shot"); c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext("2d").drawImage(video, 0, 0);
  state.live = false;
  c.style.display = "block"; video.style.visibility = "hidden";
  $("frame").hidden = true; $("barShoot").hidden = true; $("barReview").hidden = false;
  $("title").textContent = "사진 확인";
  const ok = state.current === "ready";
  $("hintText").textContent = ok ? "잘 찍혔어요" : "판정이 애매하면 추가 확인으로 접수돼요";
  $("pill").classList.toggle("ok", ok);
});
$("btnRetake").addEventListener("click", () => {
  $("shot").style.display = "none"; video.style.visibility = "visible";
  $("frame").hidden = false; $("barShoot").hidden = false; $("barReview").hidden = true;
  $("title").textContent = "주차 사진";
  state.shown = null; state.hist = []; state.okRun = 0; state.startedAt = performance.now();
  state.live = true; requestAnimationFrame(loop);
});
$("btnUse").addEventListener("click", () => {
  $("hintText").textContent = "판정 연결은 다음 단계에서 붙여요";
});
</script>
</body>
</html>
